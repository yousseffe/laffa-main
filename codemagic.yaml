workflows:
  android-release-bundle:
    name: Android Release Bundle (AAB)
    environment:
      # Pinned instead of "stable": Flutter 3.47.x raised its minimum required
      # Gradle/AGP/Kotlin versions, which broke this project's build. 3.44.9 is
      # the last release before that jump and matches what worked before.
      flutter: 3.44.9
    scripts:
      # Install dependencies
      - flutter pub get
      # Regenerate the native app icon from assets/images/laffa_logo.png
      - dart run flutter_launcher_icons
      # The keystore Gradle expects (android/app/my-release-key.jks) is gitignored,
      # but a copy is committed at the repo root - put it where Gradle looks for it.
      - cp my-release-key.jks android/app/my-release-key.jks
      # AAB for Play Store upload, APK so it can be installed directly on a phone
      - flutter build appbundle --release
      - flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk
